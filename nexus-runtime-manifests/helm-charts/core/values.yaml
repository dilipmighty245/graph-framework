debugtools:
  imageTag: latest
watchListClient: true
nexusKubeApiserver:
  image: registry.k8s.io/kube-apiserver:v1.34.3
  imageTag: latest
nexusApiGw:
  imageTag: latest
nexusEtcdKubectl:
  imageTag: latest
global:
  useHttps: false
  tainted: true
  nodeSelector:
    nexus: api
  k8sProxyServiceName: nexus-k8s-proxy
  api_gateway:
    pub_key: ""
    cert: ""
  registry: gcr.io/nsx-sm/nexus
  cronApiVersion: "batch/v1"
  resources: {}
  proxy:
    loadbalancer: false
  createEtcd: true
  etcd:
    storageClassName: gp3-ebs
    selectors: |
        app: nexus-etcd
        nexus: nexus-etcd

# Reuse the generated Secret on Helm upgrades. For GitOps, provision a Secret
# with ca.crt, apiserver.crt/key, sa.key, kubeconfig and proxy-kubeconfig.
runtimeTLS:
  secretName: nexus-k8s-apiserver-certs
  existingSecret: false
  serviceName: nexus-k8s-apiserver
  validityDays: 365
runtimeImages:
  kubectl: registry.k8s.io/kubectl:v1.34.3
  pullPolicy: IfNotPresent
