apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-kube-apiserver
  namespace: {{ default .Release.Namespace .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-kube-apiserver
  template:
    metadata:
      labels:
        app: nexus-kube-apiserver
    spec:
      {{- if eq .Values.global.tainted true }}
      {{- template "tolerations" .}}
      {{- end }}
      containers:
      - name: kube-apiserver
        image: {{ .Values.runtimeImages.apiserver | quote }}
        imagePullPolicy: {{ .Values.runtimeImages.pullPolicy }}
        command:
        - kube-apiserver
        - --etcd-servers=http://nexus-etcd:2379
        - --secure-port=6443
        - --tls-cert-file=/custom/k8s/certs/apiserver.crt
        - --tls-private-key-file=/custom/k8s/certs/apiserver.key
        - --client-ca-file=/custom/k8s/certs/ca.crt
        - --anonymous-auth=false
        - --authorization-mode=AlwaysAllow
        - --service-account-key-file=/custom/k8s/certs/sa.key
        - --service-account-signing-key-file=/custom/k8s/certs/sa.key
        - --service-account-issuer=https://nexus-apiserver:6443
        - --service-cluster-ip-range=10.24.0.0/16
        - --endpoint-reconciler-type=none
        - --disable-admission-plugins=RuntimeClass,DefaultIngressClass,DefaultStorageClass,StorageObjectInUseProtection,Priority,ResourceQuota,PersistentVolumeClaimResize
        ports:
        - containerPort: 6443
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 30
          failureThreshold: 8
        {{- template "kube_apiserver_resources" .}}
        volumeMounts:
        - name: certs
          mountPath: /custom/k8s/certs
          readOnly: true
      # Preserve the legacy HTTP endpoint. Only the proxy authenticates to TLS.
      - name: api-proxy
        image: {{ .Values.runtimeImages.kubectl | quote }}
        imagePullPolicy: {{ .Values.runtimeImages.pullPolicy }}
        command: [kubectl, proxy, --address=0.0.0.0, --port=8080, --disable-filter=true, --kubeconfig=/custom/k8s/certs/proxy-kubeconfig]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: certs
          mountPath: /custom/k8s/certs
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: {{ .Values.runtimeTLS.secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-apiserver
  namespace: {{ default .Release.Namespace .Values.global.namespace }}
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: https
    port: 6443
    targetPort: 6443
  selector:
    app: nexus-kube-apiserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-kube-controllermanager
  namespace: {{ default .Release.Namespace .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nexus-kube-controllermanager
  template:
    metadata:
      labels:
        name: nexus-kube-controllermanager
    spec:
      {{- if eq .Values.global.tainted true }}
      {{- template "tolerations" .}}
      {{- end }}
      containers:
      - name: kube-controllermanager
        image: {{ .Values.runtimeImages.controllerManager | quote }}
        imagePullPolicy: {{ .Values.runtimeImages.pullPolicy }}
        command:
        - kube-controller-manager
        - --kubeconfig=/custom/k8s/certs/kubeconfig
        - --service-account-private-key-file=/custom/k8s/certs/sa.key
        - --root-ca-file=/custom/k8s/certs/ca.crt
        - --leader-elect=false
        - --authentication-skip-lookup=true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10257
            scheme: HTTPS
          initialDelaySeconds: 30
          failureThreshold: 8
        {{- template "kube_controllermanager_resources" .}}
        volumeMounts:
        - name: certs
          mountPath: /custom/k8s/certs
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: {{ .Values.runtimeTLS.secretName }}
---
# Existing jobs still use this Service name.
apiVersion: v1
kind: Service
metadata:
  name: nexus-proxy-container
  namespace: {{ default .Release.Namespace .Values.global.namespace }}
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: nexus-kube-apiserver
