# regression test for https://github.com/dilipmighty245/graph-framework-for-microservices/gqlgen/issues/721

extend type Query {
    wrappedStruct: WrappedStruct!
    wrappedScalar: WrappedScalar!
    wrappedMap: WrappedMap!
    wrappedSlice: WrappedSlice!
}

type WrappedStruct {
    name: WrappedScalar!
    desc: WrappedScalar
}
scalar WrappedScalar
type WrappedMap {
    get(key: String!): String!
}
type WrappedSlice {
    get(idx: Int!): String!
}
