apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-k8s-apiserver
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
  labels:
    app: nexus-k8s-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-k8s-apiserver
  template:
    metadata:
      labels:
        app: nexus-k8s-apiserver
    spec:
      {{- if eq .Values.global.tainted true }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nexus
                operator: In
                values:
                - api
      tolerations:
      - key: nexus
        operator: Equal
        value: api
      {{- end }}
      containers:
      - command:
        - kube-apiserver
        - --etcd-servers=http://nexus-etcd:2379
        - --service-account-key-file=/custom/k8s/certs/sa.key
        - --service-account-signing-key-file=/custom/k8s/certs/sa.key
        - --tls-cert-file=/custom/k8s/certs/apiserver.crt
        - --tls-private-key-file=/custom/k8s/certs/apiserver.key
        - --client-ca-file=/custom/k8s/certs/ca.crt
        - --service-account-issuer=https://nexus-k8s-apiserver:6443
        - --anonymous-auth=false
        - --authorization-mode=AlwaysAllow
        - --service-cluster-ip-range=10.24.0.0/16
        - --disable-admission-plugins=CertificateApproval,CertificateSigning,CertificateSubjectRestriction,DefaultIngressClass,DefaultStorageClass,DefaultTolerationSeconds,LimitRanger,MutatingAdmissionWebhook,NamespaceLifecycle,PersistentVolumeClaimResize,PodSecurity,Priority,ResourceQuota,RuntimeClass,ServiceAccount,StorageObjectInUseProtection,TaintNodesByCondition,ValidatingAdmissionPolicy,ValidatingAdmissionWebhook,NodeRestriction,PodNodeSelector
        {{- if .Values.nexusKubeApiserver.image }}
        image: {{ .Values.nexusKubeApiserver.image | quote }}
        {{- else }}
        image: "{{ if .Values.imageRegistry }}{{ trimSuffix "/" .Values.imageRegistry }}/{{ end }}nexus/nexus-kube-apiserver:{{ default .Values.nexusKubeApiserver.imageTag .Values.imageTag }}"
        {{- end }}
        imagePullPolicy: {{ .Values.runtimeImages.pullPolicy }}
        ports:
          - containerPort: 6443
        env:
        - name: KUBERNETES_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        name: k8s-apiserver
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        {{- template "kube_apiserver_resources" .}}
        volumeMounts:
            - name: nexus-k8s-apiserver-certs
              mountPath: "/custom/k8s/certs"
              readOnly: true
      restartPolicy: Always
      securityContext: {}
      volumes:
      - name: nexus-k8s-apiserver-certs
        secret:
            secretName: {{ .Values.runtimeTLS.secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-k8s-apiserver
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
  labels:
    component: nexus-apiserver
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 6443
      name: https
      targetPort: 6443
  selector:
      app: nexus-k8s-apiserver
---
apiVersion: v1
kind: Service
metadata:
  name: kind-control-plane
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 6443
      name: https
      targetPort: 6443
  selector:
      app: nexus-k8s-apiserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-k8s-proxy
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
  labels:
    app: nexus-k8s-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-k8s-proxy
  template:
    metadata:
      labels:
        app: nexus-k8s-proxy
    spec:
      containers:
      - name: proxy-container
        image: {{ .Values.runtimeImages.kubectl | quote }}
        command: [ "kubectl", "proxy", "--disable-filter=true", "--address=0.0.0.0", "--kubeconfig", "/var/lib/k0s/pki/kubeconfig"]
        ports:
          - containerPort: 8001
        imagePullPolicy: {{ .Values.runtimeImages.pullPolicy }}
        volumeMounts:
            - name: nexus-k8s-apiserver-kubeconfig
              mountPath: "/var/lib/k0s/pki"
              readOnly: true
      restartPolicy: Always
      securityContext: {}
      volumes:
      - name: nexus-k8s-apiserver-kubeconfig
        secret:
            secretName: {{ .Values.runtimeTLS.secretName }}
            items:
            - key: kubeconfig
              path: kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-k8s-proxy
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
spec:
  ports:
    - protocol: TCP
      name: http
      port: 80
      targetPort: 8001
  selector:
      app: nexus-k8s-proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-api-gw
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
data:
  api-gw-config.yaml: |
    server:
      address: ":443"
      httpPort: "8082"
      certPath: "/etc/cert/cert.pem"
      keyPath: "/etc/cert/key.pem"
    enable_nexus_runtime: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api-gw
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
  labels:
    app: nexus-api-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-api-gw
  template:
    metadata:
      labels:
        app: nexus-api-gw
    spec:
      {{- if eq .Values.global.tainted true }}
      tolerations:
      - key: nexus
        operator: Equal
        value: api
      {{- end }}
      containers:
      - name: nexus-api-gw
{{- if ne .Values.imageRegistry "" }}
        image: "{{ if .Values.imageRegistry }}{{ trimSuffix "/" .Values.imageRegistry }}/{{ end }}nexus/api-gw:{{ default .Values.nexusApiGw.imageTag .Values.imageTag }}"
{{- else }}
        image: "nexus/api-gw:{{ default .Values.nexusApiGw.imageTag .Values.imageTag }}"
{{- end }}
        imagePullPolicy: IfNotPresent
        env:
        - name: KUBE_FEATURE_WatchListClient
          value: {{ .Values.watchListClient | quote }}
        - name: KUBECONFIG
          value: /etc/config/kubeconfig/kubeconfig
        - name: APIGWCONFIG
          value: /etc/config/api-gw-config.yaml
        - name: KUBEAPI_ENDPOINT
          value: "http://nexus-k8s-proxy:80"
        volumeMounts:
        - name: nexus-k8s-apiserver-kubeconfig
          mountPath: "/etc/config/kubeconfig"
          readOnly: true
        - mountPath: /etc/config
          name: nexus-api-gw
          readOnly: true
      restartPolicy: Always
      securityContext: {}
      volumes:
      - name: nexus-k8s-apiserver-kubeconfig
        secret:
            secretName: {{ .Values.runtimeTLS.secretName }}
            items:
            - key: kubeconfig
              path: kubeconfig
      - configMap:
          name: nexus-api-gw
          defaultMode: 0555
        name: nexus-api-gw
