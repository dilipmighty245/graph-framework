name: Bug report
description: Report a reproducible problem in the framework
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal model or command sequence when possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit or release, component, OS/architecture, Go version, and Kubernetes or Docker versions if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and test results
      description: Include the failing command and relevant output. Remove credentials and private data.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional context
